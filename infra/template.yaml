AWSTemplateFormatVersion: "2010-09-09"
Description: WellProfitAI - datos de pozos en S3, Lambda de consulta y Bedrock Agent.

Parameters:
  FoundationModel:
    Type: String
    Default: us.anthropic.claude-3-5-haiku-20241022-v1:0
    Description: ID del modelo o inference profile de Bedrock (debe tener acceso habilitado en la cuenta).

Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  DataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt DataBucket.Arn, !Sub "${DataBucket.Arn}/*"]
            Condition:
              Bool: {aws:SecureTransport: "false"}

  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ReadWellData
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${DataBucket.Arn}/*"

  WellsFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: handler.lambda_handler
      Code: lambda/
      Role: !GetAtt FunctionRole.Arn
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          DATA_BUCKET: !Ref DataBucket

  AgentRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: {Service: bedrock.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals: {aws:SourceAccount: !Ref AWS::AccountId}
      Policies:
        - PolicyName: InvokeModel
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream, bedrock:GetInferenceProfile]
                Resource:
                  - arn:aws:bedrock:*::foundation-model/*
                  - !Sub arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*

  WellsAgent:
    Type: AWS::Bedrock::Agent
    Properties:
      AgentName: !Sub "${AWS::StackName}-wells-agent"
      AgentResourceRoleArn: !GetAtt AgentRole.Arn
      FoundationModel: !Ref FoundationModel
      AutoPrepare: true
      IdleSessionTTLInSeconds: 900
      Description: Consulta datos de pozos sinteticos de WellProfitAI.
      Instruction: >-
        Sos el agente de datos de WellProfitAI. Respondes preguntas sobre 200 pozos
        horizontales sinteticos de las cuencas Permian, Eagle Ford, Delaware y Midland.
        Usa siempre las herramientas para obtener datos; no inventes valores.
        Todos los costos estan en dolares (USD). El EUR esta en MMBOE (millones de barriles).
        Para evaluar un pozo nuevo, busca pozos analogos con sus propiedades geologicas
        y de completacion. Responde en el idioma del usuario.
      ActionGroups:
        - ActionGroupName: wells-data
          Description: Consultas sobre cuencas, pozos, perfiles de produccion y pozos analogos.
          ActionGroupExecutor:
            Lambda: !GetAtt WellsFunction.Arn
          ApiSchema:
            Payload: |
              openapi: 3.0.0
              info:
                title: WellProfitAI Wells API
                version: 1.0.0
                description: Datos de pozos sinteticos. Costos en USD.
              paths:
                /basins/summary:
                  get:
                    operationId: getBasinSummary
                    description: Promedios por cuenca (geologia, IP, EUR, CAPEX en USD) y OPEX por barril.
                    parameters:
                      - name: basin
                        in: query
                        required: false
                        description: Permian, Eagle Ford, Delaware o Midland. Si se omite devuelve todas.
                        schema: {type: string}
                    responses:
                      "200":
                        description: Resumen por cuenca.
                        content:
                          application/json:
                            schema: {type: object}
                /wells:
                  get:
                    operationId: listWells
                    description: Lista pozos con metricas clave (maximo 50), ordenados de mayor a menor.
                    parameters:
                      - name: basin
                        in: query
                        required: false
                        description: Filtrar por cuenca.
                        schema: {type: string}
                      - name: sort_by
                        in: query
                        required: false
                        description: ip_bbl_d, eur_mmboe o capex_total_usd. Por defecto eur_mmboe.
                        schema: {type: string}
                      - name: limit
                        in: query
                        required: false
                        description: Cantidad de pozos (1-50). Por defecto 20.
                        schema: {type: integer}
                    responses:
                      "200":
                        description: Lista de pozos.
                        content:
                          application/json:
                            schema: {type: object}
                /wells/{well_id}:
                  get:
                    operationId: getWell
                    description: Todos los datos de un pozo (geologia, completacion, Arps, CAPEX en USD, EUR).
                    parameters:
                      - name: well_id
                        in: path
                        required: true
                        description: ID del pozo, por ejemplo W001.
                        schema: {type: string}
                    responses:
                      "200":
                        description: Datos del pozo.
                        content:
                          application/json:
                            schema: {type: object}
                /wells/{well_id}/production:
                  get:
                    operationId: getProductionProfile
                    description: Perfil de produccion proyectado a 30 anos (declinacion Arps).
                    parameters:
                      - name: well_id
                        in: path
                        required: true
                        description: ID del pozo, por ejemplo W001.
                        schema: {type: string}
                      - name: granularity
                        in: query
                        required: false
                        description: annual (por defecto, 30 filas) o monthly (360 valores).
                        schema: {type: string}
                    responses:
                      "200":
                        description: Perfil de produccion.
                        content:
                          application/json:
                            schema: {type: object}
                /analogs:
                  post:
                    operationId: findAnalogs
                    description: Encuentra los pozos mas parecidos a un pozo nuevo (distancia euclidiana normalizada).
                    requestBody:
                      required: true
                      content:
                        application/json:
                          schema:
                            type: object
                            required: [depth_m, porosity_pct, permeability_md, lateral_length_m, frac_stages, proppant_tonnes]
                            properties:
                              depth_m: {type: number, description: Profundidad en metros}
                              porosity_pct: {type: number, description: Porosidad en porcentaje}
                              permeability_md: {type: number, description: Permeabilidad en milidarcys}
                              lateral_length_m: {type: number, description: Longitud lateral en metros}
                              frac_stages: {type: integer, description: Etapas de fractura}
                              proppant_tonnes: {type: number, description: Propante en toneladas}
                              n: {type: integer, description: Cantidad de analogos (1-20). Por defecto 5.}
                    responses:
                      "200":
                        description: Pozos analogos con su distancia.
                        content:
                          application/json:
                            schema: {type: object}

  AgentInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WellsFunction
      Action: lambda:InvokeFunction
      Principal: bedrock.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !GetAtt WellsAgent.AgentArn

  WellsAgentAlias:
    Type: AWS::Bedrock::AgentAlias
    Properties:
      AgentId: !Ref WellsAgent
      AgentAliasName: live

Outputs:
  DataBucketName:
    Value: !Ref DataBucket
  FunctionName:
    Value: !Ref WellsFunction
  AgentId:
    Value: !GetAtt WellsAgent.AgentId
  AgentAliasId:
    Value: !GetAtt WellsAgentAlias.AgentAliasId
